server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security header baseline (Master Ecosystem Report XM-5). `always` so they
    # also apply to redirects/errors. Re-declared in the static-asset location
    # below because a location-level add_header drops inherited server headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Serve static assets with cache headers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Redirect root to default locale instantly (avoids Astro's JS redirect blank page)
    location = / {
        return 302 /en/;
    }

    # i18n routing: try file, then directory index, then fallback to /en/
    location / {
        try_files $uri $uri/ $uri/index.html /en/index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
