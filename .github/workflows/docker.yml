name: Build & Push Docker image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

  notify:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: 📨 Notify Discord
        # Untrusted input (commit message) must reach the shell only via env,
        # never via ${{ }} interpolation inside `run` (script injection).
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          FIRST_LINE=$(printf '%s\n' "$COMMIT_MSG" | head -1)
          jq -n --arg msg "$FIRST_LINE" \
            '{content: ("# 🚀 DESPLEGANT A PRO 🚀\n# ⚠️ GIT PULL LANDING\n- " + $msg)}' \
            | curl -sS -X POST "$WEBHOOK" \
              -H "Content-Type: application/json" \
              -d @-
